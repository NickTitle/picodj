<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101018">
  <title>Pocket Tracker</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; overscroll-behavior: none; }
    iframe { display: block; width: 100%; height: 100%; height: 100dvh; border: 0; background: #000; touch-action: none; }
    #file-toggle { position: fixed; top: max(8px, env(safe-area-inset-top)); right: 8px; z-index: 3; }
    #file-panel { position: fixed; top: max(42px, calc(env(safe-area-inset-top) + 42px)); right: 8px; z-index: 3;
      width: min(260px, calc(100vw - 16px)); padding: 10px; border: 1px solid #5b5b79; border-radius: 6px;
      background: #101018ee; font: 13px/1.35 system-ui, sans-serif; }
    #file-panel[hidden] { display: none; }
    #file-panel button { display: block; width: 100%; margin: 6px 0; padding: 7px; text-align: left; }
    #file-status { min-height: 2.7em; margin: 8px 1px 0; color: #c9c9de; }
  </style>
</head>
<body>
  <iframe id="cart" src="tracker.html" title="Pocket Tracker PICO-8 cartridge" allow="autoplay"></iframe>
  <button id="file-toggle" type="button" aria-expanded="false" aria-controls="file-panel">Files</button>
  <section id="file-panel" aria-label="Lossless project files" hidden>
    <strong>Lossless project files</strong>
    <button type="button" data-file-action="json">Export Pocket Tracker JSON</button>
    <button type="button" data-file-action="authored">Export .p8 — authored + profile</button>
    <button type="button" data-file-action="materialized">Export .p8 — materialized playback</button>
    <button type="button" data-file-action="import">Import JSON / .p8 audio</button>
    <input id="project-import" type="file" accept=".json,.p8,application/json" hidden>
    <p id="file-status" role="status" aria-live="polite">Save in the tracker before exporting.</p>
  </section>
  <script src="mobile.js"></script>
</body>
</html>
